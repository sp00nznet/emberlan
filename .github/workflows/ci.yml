# Public repo: conformance on every push/PR (REPO_RULES section 8/9).
# A version tag (v1.2.3) also builds the Windows installer and Android APK
# and attaches them to a GitHub Release.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Fails on any check that passed in conformance/results.json.
      - run: node conformance/run.js
        env: { CHROME_PATH: /usr/bin/google-chrome }

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: electron-client
      - run: npm run build:win
        working-directory: electron-client
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'electron-client/dist/*.exe' }

  android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
        working-directory: mobile
      - run: npm run copy-client && npx cap sync android && cd android && ./gradlew assembleDebug
        working-directory: mobile
      # ponytail: debug-signed APK (sideload). Release signing needs a keystore secret; add when it goes to a store.
      - run: mv mobile/android/app/build/outputs/apk/debug/app-debug.apk "Emberlan-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: '*.apk' }

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      # Notes come from the CHANGELOG section for this version.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \[" v "\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*/* --title "Emberlan $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
